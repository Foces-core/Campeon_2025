name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            campeon2/package-lock.json
      - name: Pin npm version
        run: npm install --global npm@10.9.4
      - name: Install website dependencies
        run: npm ci
      - name: Lint website
        run: npm run lint
      - name: Build website
        run: npm run build
      - name: Install Studio dependencies
        run: npm ci
        working-directory: campeon2
      - name: Lint Studio
        run: npm run lint
        working-directory: campeon2
      - name: Build Studio
        run: npm run build
        working-directory: campeon2
